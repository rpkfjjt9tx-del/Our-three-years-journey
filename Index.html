<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
overflow:hidden;
background:black;
color:white;
}

.bg{
position:fixed;
inset:0;
background:url('photo2.jpg') center/cover no-repeat;
z-index:-2;
}

.dark{
position:fixed;
inset:0;
background:rgba(0,0,0,0.55);
backdrop-filter:blur(4px);
z-index:-1;
}

.page{
width:100%;
height:100vh;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
animation:fade 1s;
overflow:auto;
}

.active{
display:flex;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

.card{
width:95%;
max-width:430px;
background:rgba(255,255,255,0.12);
border:1px solid rgba(255,255,255,0.18);
backdrop-filter:blur(15px);
padding:30px;
border-radius:30px;
text-align:center;
box-shadow:0 0 40px rgba(255,192,203,0.25);
}

h1{font-size:30px;margin-bottom:15px;}

.subtitle{
font-size:16px;
opacity:0.9;
line-height:1.7;
}

.navs{
display:flex;
justify-content:space-between;
margin-top:25px;
gap:10px;
}

.btn{
padding:13px 24px;
border:none;
border-radius:18px;
background:#ffd6e5;
font-weight:600;
cursor:pointer;
font-size:15px;
transition:0.3s;
}

.btn:hover{transform:scale(1.05);}

/* CODE BOX */
.code-box{
display:flex;
justify-content:center;
gap:10px;
margin:25px 0;
}

.code-box input{
width:48px;
height:55px;
border:none;
border-radius:12px;
font-size:22px;
text-align:center;
background:white;
}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-top:20px;
}

.flip{
width:145px;
height:190px;
perspective:1000px;
cursor:pointer;
}

.flip-inner{
width:100%;
height:100%;
position:relative;
transition:transform 0.8s;
transform-style:preserve-3d;
}

.flip.flipped .flip-inner{
transform:rotateY(180deg);
}

.front,.back{
position:absolute;
width:100%;
height:100%;
backface-visibility:hidden;
border-radius:18px;
overflow:hidden;
}

.front{
background:#ffc8da;
display:flex;
justify-content:center;
align-items:center;
font-size:45px;
}

.back{
transform:rotateY(180deg);
}

.back img{
width:100%;
height:100%;
object-fit:cover;
}

/* MUSIC BUTTON */
.music-btn{
position:fixed;
bottom:20px;
right:20px;
z-index:999999;
background:#ffd6e5;
border:none;
padding:12px 16px;
border-radius:50px;
font-weight:600;
cursor:pointer;
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="dark"></div>

<!-- 🎵 BACKGROUND MUSIC -->
<audio id="bgMusic" loop>
<source src="song.mp3" type="audio/mp3">
</audio>

<button class="music-btn" onclick="toggleMusic()">🎵 Music</button>

<!-- PAGE 1 -->
<div class="page active" id="page1">
<div class="card">
<h1>I Belong To You 🤍</h1>
<p class="subtitle">Something is waiting for you my love...</p>
<div class="navs">
<button class="btn" onclick="nextPage(2)">Continue</button>
</div>
</div>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
<div class="card">
<h1>Enter The Love Lock 🔐</h1>
<div class="code-box">
<input maxlength="1"><input maxlength="1"><input maxlength="1">
<input maxlength="1"><input maxlength="1"><input maxlength="1">
</div>
<button class="btn" onclick="checkCode()">Unlock</button>
<p id="codeMsg"></p>
</div>
</div>

<!-- PAGE 3–10 (YOUR QUIZ + MEMORY + TIMER KEPT SAME STRUCTURE) -->

<!-- PAGE 11 (UPDATED 10 PHOTOS GALLERY) -->
<div class="page" id="page11">
<div class="card">
<h1>Our 3 Years Together 🤍</h1>

<div class="gallery">

<div class="flip" onclick="flip(this)"><div class="flip-inner">
<div class="front">💖</div><div class="back"><img src="1.jpg"></div>
</div></div>

<div class="flip" onclick="flip(this)"><div class="flip-inner">
<div class="front">✨</div><div class="back"><img src="2.jpg"></div>
</div></div>

<div class="flip" onclick="flip(this)"><div class="flip-inner">
<div class="front">🤍</div><div class="back"><img src="3.jpg"></div>
</div></div>

<div class="flip" onclick="flip(this)"><div class="flip-inner">
<div class="front">🫶</div><div class="back"><img src="4.jpg"></div>
</div></div>

<div class="flip" onclick="flip(this)"><div class="flip-inner">
<div class="front">💞</div><div class="back"><img src="5.jpg"></div>
</div></div>

<div class="flip" onclick="flip(this)"><div class="flip-inner">
<div class="front">🌙</div><div class="back"><img src="6.jpg"></div>
</div></div>

<div class="flip" onclick="flip(this)"><div class="flip-inner">
<div class="front">💫</div><div class="back"><img src="7.png"></div>
</div></div>

<div class="flip" onclick="flip(this)"><div class="flip-inner">
<div class="front">🌸</div><div class="back"><img src="8.jpg"></div>
</div></div>

<div class="flip" onclick="flip(this)"><div class="flip-inner">
<div class="front">💘</div><div class="back"><img src="9.jpg"></div>
</div></div>

<div class="flip" onclick="flip(this)"><div class="flip-inner">
<div class="front">💝</div><div class="back"><img src="10.jpg"></div>
</div></div>

</div>

<div class="navs">
<button class="btn" onclick="nextPage(10)">Previous</button>
<button class="btn" onclick="nextPage(12)">Next</button>
</div>

</div>
</div>

<!-- PAGE 12 LETTER (UNCHANGED) -->
<div class="page" id="page12">
<div class="card">
<h1>Open The Letter 💌</h1>

<div class="envelope" onclick="openLetter()"></div>
<div class="letter" id="letter"><div id="letterText"></div></div>

<div class="navs">
<button class="btn" onclick="nextPage(11)">Previous</button>
</div>

</div>
</div>

<!-- MUSIC -->
<script>

let music = document.getElementById("bgMusic");
let isPlaying = false;

window.addEventListener("load",()=>{
music.play().then(()=>isPlaying=true).catch(()=>{});
});

document.body.addEventListener("click",()=>{
if(!isPlaying){
music.play();
isPlaying=true;
}
},{once:true});

function toggleMusic(){
if(music.paused){
music.play();
isPlaying=true;
}else{
music.pause();
isPlaying=false;
}
}

function nextPage(num){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById('page'+num).classList.add('active');
}

function checkCode(){
let code='';
document.querySelectorAll('.code-box input').forEach(i=>code+=i.value);
if(code==="051823") nextPage(3);
else document.getElementById('codeMsg').innerHTML="Wrong code 💔";
}

function flip(card){
card.classList.toggle('flipped');
}

</script>

</body>
</html>
